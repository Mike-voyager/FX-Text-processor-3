[pytest]
markers =
    security: marks tests as security-related (deselect with '-m "not security"')
    slow: marks tests as slow (deselect with '-m "not slow"')
    breaks_pytest: marks tests that may break pytest collection
    crypto: marks cryptographic tests, often with NIST vectors (deselect with '-m "not crypto"')
    integration: marks integration tests (deselect with '-m "not integration"')
    performance: marks tests as performance-related (deselect with '-m "not performance"')
    gui: marks tests as GUI-related (deselect with '-m "not gui"')
    themes: marks tests as theme-related (deselect with '-m "not themes"')
    e2e: marks tests as end-to-end tests (deselect with '-m "not e2e"')

pythonpath = .
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

addopts = 
    --strict-markers
    --tb=short
    -ra
